name: Validar Workers

on:
  push:
    branches: [main, cloudflare-git]
  # Validate stacked preview PRs before any merge into main.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          # Required by read-only release preflight to compare against the actual main ancestry.
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar versões fixadas
        run: npm ci
      - name: Preparar renderização local de vídeo e voz PT-BR
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Preparar exemplos sintéticos para homologação local
        run: node tools/mls_owner_preview_assets.mjs --directory "${{ runner.temp }}/mls-owner-preview-media" --render-local
      - name: Executar suíte Node completa com concorrência limitada para Chrome
        env:
          MLS_QA_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/v36
          MLS_APPROVED_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/all-panels
          MLS_ROADMAP_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/roadmap
          MLS_AGENTS_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/agents
          MLS_PRODUCTS_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/products
          MLS_OWNER_PREVIEW_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/owner-preview
          MLS_OWNER_PREVIEW_MEDIA_DIR: ${{ runner.temp }}/mls-owner-preview-media
          MLS_AI_SALES_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/ai-sales
          MLS_PRODUCTION_SCREENSHOT_DIR: ${{ runner.temp }}/mls-approved-design/production
        run: |
          npm run build
          node --test --test-reporter=tap --test-concurrency=3 web/cloudflare/tests/*.test.mjs web/finance/tests/*.test.mjs tools/tests/*.test.mjs
      - name: Gerar comparação visual sem aprovação automática
        run: node tools/mls_visual_comparison.mjs --captures="${{ runner.temp }}/mls-approved-design/all-panels/normal-connected" --output="${{ runner.temp }}/mls-approved-design/comparison-normal-connected.html"
      - name: Guardar capturas sintéticas dos painéis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mls-approved-design-all-panels-qa
          path: ${{ runner.temp }}/mls-approved-design
          if-no-files-found: ignore
          retention-days: 7
      - name: Validar ponte financeira e atualização do Hermes
        run: python3 -m unittest web/bridge/test_hermes_bridge.py tools/test_install_hermes_web_bridge.py tools/test_build_hermes_web_bridge_install.py tools/test_activate_hermes_web_bridge.py tools/test_build_hermes_web_bridge_activation.py -q
      - name: Gerar os três Workers
        run: npm run build
      - name: Pré-release local e não destrutivo
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: node tools/release_preflight.mjs --base=origin/main
