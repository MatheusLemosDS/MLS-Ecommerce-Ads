name: Validar Workers

on:
  push:
    branches: [main, cloudflare-git]
  pull_request:
    branches: [main, cloudflare-git]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar versões fixadas
        run: npm ci
      - name: Executar testes
        env:
          MLS_PRODUCTS_SCREENSHOT_DIR: ${{ runner.temp }}/mls-products-visual
        run: npm test
      - name: Guardar capturas sintéticas do painel Produtos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mls-products-synthetic-visual-qa
          path: ${{ runner.temp }}/mls-products-visual
          if-no-files-found: ignore
          retention-days: 7
      - name: Validar ponte financeira e atualização do Hermes
        run: python3 -m unittest web/bridge/test_hermes_bridge.py tools/test_install_hermes_web_bridge.py tools/test_build_hermes_web_bridge_install.py tools/test_activate_hermes_web_bridge.py tools/test_build_hermes_web_bridge_activation.py -q
      - name: Gerar os três Workers
        run: npm run build
