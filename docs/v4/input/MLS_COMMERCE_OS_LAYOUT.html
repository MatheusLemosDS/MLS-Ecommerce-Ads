.metric{--kpi:var(--panel-tone);padding:15px 13px 11px;background:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--kpi) 9%,transparent),transparent 70%),var(--surface);border-color:color-mix(in srgb,var(--kpi) 28%,var(--line));box-shadow:0 5px 18px #00000013;gap:6px}

.v4-week-sources summary::after{content:'+';margin-left:auto;font-size:16px;color:var(--muted)}
.v4-week-sources[open] summary::after{content:'−'}
.v4-week-sources p{font-size:11px;line-height:1.7;color:var(--muted);margin:0 0 11px}
.v4-week-sources .v4-week-facts{margin:0 0 12px}
.v4-week-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:25px;margin:17px 0 5px}
.v4-week-bottom p{display:flex;align-items:flex-start;gap:7px;max-width:650px;color:var(--muted);font-size:11px;line-height:1.7}
.v4-week-bottom p>.icon{width:15px;height:15px;margin-top:2px}
.v4-week-bottom nav{display:flex;align-items:center;gap:17px;flex-wrap:wrap}
.v4-week-bottom .text-link{min-height:44px;white-space:nowrap}
@container app (max-width:1150px){
  .v4-week-toolbar{align-items:flex-start;gap:18px;flex-direction:column}
  .v4-week-date-control{flex-basis:auto;width:340px;max-width:100%}
  .v4-week-periods{width:100%;max-width:none}
  .v4-week-periods>div:first-child{padding-left:0;border-left:0}
  .v4-week-summary{padding:17px 15px 13px}
  .v4-week-amount{font-size:25px}
  .v4-week-analysis-grid{grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:18px}
  .v4-week-readout{padding:14px}
}
@container app (max-width:850px){
  .v4-weekly .header-actions{justify-content:flex-start}
  .v4-week-analysis-grid{grid-template-columns:minmax(0,1fr)}
  .v4-week-readout{padding:17px}
  .v4-week-readout .v4-week-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
  .v4-week-readout .v4-week-facts>div{flex-wrap:wrap;gap:3px 10px}
  .v4-week-evidence{grid-template-columns:minmax(0,1fr);gap:18px}
  .v4-week-summary-grid{gap:10px}
  .v4-week-card-title{font-size:13px}
  .v4-week-summary-top{flex-wrap:wrap;margin-bottom:12px}
}
@container app (max-width:600px){
  .v4-week-summary-grid{grid-template-columns:minmax(0,1fr);gap:11px}
  .v4-week-summary{padding:16px 17px 13px}
  .v4-week-summary-top{margin-bottom:10px;flex-wrap:nowrap}
  .v4-week-symbol{width:32px;height:32px;border-radius:9px}
  .v4-week-card-title{font-size:14px}
  .v4-week-scope{margin-bottom:9px}
  .v4-week-value-label{margin-bottom:12px}
  .v4-week-amount{font-size:27px}
  .v4-week-analysis{padding:18px 15px}
  .v4-week-analysis-header{flex-direction:column;gap:13px}
  .v4-week-metric-label{flex-basis:auto;width:100%}
  .v4-week-analysis-header h2{font-size:18px}
  .v4-week-periods{grid-template-columns:minmax(0,1fr);gap:14px}
  .v4-week-periods>div{border:0;padding-left:0}
  .v4-week-toolbar{padding:16px}
  .v4-week-date-control>div{gap:4px}
  .v4-week-date-control select{font-size:11px;padding-left:7px;padding-right:4px}
  .v4-week-date-control .button{flex-basis:44px;min-width:44px;padding:7px}
  .v4-week-readout .v4-week-facts{display:block}
  .v4-week-bottom{flex-direction:column;gap:4px}
  .v4-week-summary-foot{font-size:11px}
  .v4-week-chart .v2-viz-grid text,.v4-week-chart .v2-viz-tick{font-size:13px}
  .v4-week-demo{font-size:11px;margin-top:-2px}
}
@media(prefers-reduced-motion:reduce){.v4-week-summary{transition:none}}

/* Account/company preview — solid surfaces, visible focus, responsive containers. */
:root{--ac4-brand:#73a9e8;--ac4-on-brand:#081a30;--ac4-story:#101e30;--ac4-inset:#0b1829;--ac4-radius:12px}
:root[data-theme=light]{--ac4-brand:#245f9e;--ac4-on-brand:#fff;--ac4-story:#edf2f8;--ac4-inset:#f7f9fc}
.ac4-public .app-root{grid-template-columns:minmax(0,1fr)}
.ac4-public .sidebar,.ac4-public .mobile-nav,.ac4-public .backdrop{display:none!important}
.ac4-public .topbar{position:relative;justify-content:space-between;min-height:80px;max-width:1340px;margin:auto;padding:18px 40px;background:var(--bg);backdrop-filter:none;border-bottom:0}
.ac4-public .workspace{max-width:1340px;padding:22px 40px 24px}
.ac4-public-brand{display:flex;align-items:center;gap:12px;font-size:17px;letter-spacing:-.45px;white-space:nowrap}
.ac4-solid-square{width:38px;height:38px;display:inline-grid;place-items:center;flex:0 0 38px;background:var(--ac4-brand);color:var(--ac4-on-brand);font-size:12px;letter-spacing:-.3px;font-weight:800;border-radius:9px}
.ac4-public-actions{display:flex;align-items:center;gap:11px}
.ac4-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:12px;font-weight:600;line-height:1.4;text-align:center;cursor:pointer;text-decoration:none;max-width:100%;transition:background .15s,border-color .15s}
.ac4-button .icon{width:17px;height:17px}
.ac4-button:hover{background:var(--raised);border-color:var(--muted)}
.ac4-button.primary{background:var(--ac4-brand);color:var(--ac4-on-brand);border-color:var(--ac4-brand)}
.ac4-button.primary:hover{filter:brightness(1.05)}
.ac4-button.text{background:transparent;border-color:transparent;color:var(--ac4-brand);padding-left:0;padding-right:0}
.ac4-button.danger{color:var(--negative);border-color:var(--line);background:var(--surface)}
.ac4-button.danger:hover{border-color:var(--negative)}
.ac4-button.wide{width:100%}
.ac4-button:focus-visible,.ac4-tabs a:focus-visible,.ac4-text-button:focus-visible,.ac4-store-button:focus-visible{outline:3px solid var(--ac4-brand);outline-offset:3px}
.ac4-auth-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:660px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.ac4-auth-story{padding:42px 42px 34px;background:var(--ac4-story);display:flex;flex-direction:column;justify-content:space-between;gap:36px;border-right:1px solid var(--line)}
.ac4-auth-story h1{font-size:37px;line-height:1.16;letter-spacing:-1.1px;max-width:450px;margin-top:22px;font-weight:680}
.ac4-auth-story>div>p{margin-top:19px;max-width:410px;color:var(--muted);font-size:14px;line-height:1.8}
.ac4-badge{display:inline-flex;align-items:center;gap:5px;min-height:25px;max-width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--raised);color:var(--muted);font-size:10px;line-height:1.35;font-weight:600}
.ac4-badge.blue{color:var(--ac4-brand);background:var(--soft)}
.ac4-badge.good{color:var(--positive);background:var(--surface)}
.ac4-badge.warning{color:var(--warning);background:var(--surface)}
.ac4-badge.brand{background:var(--surface);font-size:10px;color:var(--ac4-brand);letter-spacing:1.2px;padding:6px 9px}
.ac4-story-panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.ac4-story-panel-head{display:flex;gap:11px;align-items:center;padding:19px 20px;background:var(--ac4-inset);border-bottom:1px solid var(--line)}
.ac4-story-panel-head strong{display:block;font-size:13px;font-weight:650}
.ac4-story-panel-head small{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.6}
.ac4-store-mark{flex:0 0 38px;width:38px;height:38px;background:var(--soft);color:var(--ac4-brand);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.ac4-story-item{display:grid;grid-template-columns:20px minmax(0,1fr) 16px;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.ac4-story-item:last-child{border-bottom:0}
.ac4-story-item>.icon{color:var(--muted);width:18px;height:18px}
.ac4-story-item>.icon:last-child{color:var(--positive);width:15px;height:15px}
.ac4-story-item strong{display:block;font-size:12px;font-weight:600}
.ac4-story-item span{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.6}
.ac4-story-footer{display:flex;gap:13px;align-items:center}
.ac4-story-footer .ac4-solid-square{background:var(--surface);color:var(--muted);border:1px solid var(--line);width:36px;height:36px;flex-basis:36px}
.ac4-story-footer p{font-size:10px;color:var(--muted);line-height:1.8}
.ac4-story-footer strong{color:var(--text);font-weight:500}
.ac4-auth-panel{display:flex;flex-direction:column;justify-content:center;padding:38px 44px 28px;min-width:0}
.ac4-auth-panel-inner{max-width:405px;width:100%;margin:auto}
.ac4-auth-kicker{font-size:10px;color:var(--ac4-brand);letter-spacing:1.4px;font-weight:650;margin:0 0 10px}
.ac4-auth-panel h2{font-size:27px;letter-spacing:-.65px;line-height:1.25;font-weight:670}
.ac4-auth-copy{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8}
.ac4-form{display:flex;flex-direction:column;gap:19px;margin-top:25px;min-width:0}
.ac4-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.ac4-field>label{font-size:12px;color:var(--text);font-weight:550}
.ac4-field input,.ac4-field select{height:44px;min-height:44px;width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--ac4-inset);color:var(--text);padding:10px 12px;font-size:13px;outline-offset:3px}
.ac4-field input::placeholder{color:var(--muted);opacity:.85}
.ac4-field input:focus,.ac4-field select:focus{border-color:var(--ac4-brand)}
.ac4-field small{font-size:10px;color:var(--muted);line-height:1.6}
.ac4-field.full{grid-column:1/-1}
.ac4-fields-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ac4-password{display:flex;border:1px solid var(--line);border-radius:7px;background:var(--ac4-inset);min-width:0}
.ac4-password:focus-within{border-color:var(--ac4-brand)}
.ac4-password input{border:0;flex:1;border-radius:7px 0 0 7px;background:transparent;min-width:0}
.ac4-password button{width:44px;flex:0 0 44px;display:grid;place-items:center;color:var(--muted);border-radius:0 7px 7px 0}
.ac4-password button:hover{color:var(--text)}
.ac4-inline-links{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-top:-3px}
.ac4-inline-links a,.ac4-auth-bottom a{font-weight:600;color:var(--ac4-brand)}
.ac4-auth-or{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--muted);margin:22px 0 16px}
.ac4-auth-or:before,.ac4-auth-or:after{content:'';height:1px;flex:1;background:var(--line)}
.ac4-auth-bottom{font-size:12px;color:var(--muted);text-align:center;margin-top:23px}
.ac4-text-button{display:block;font-size:10px;color:var(--muted);min-height:35px;padding:6px 0;margin:9px auto 0}
.ac4-text-button:hover{color:var(--ac4-brand)}
.ac4-auth-disclaimer{display:flex;gap:8px;font-size:10px;line-height:1.7;color:var(--muted);max-width:405px;width:100%;margin:29px auto 0;padding-top:18px;border-top:1px solid var(--line)}
.ac4-auth-disclaimer>.icon{width:14px;height:14px;margin-top:2px}
.ac4-back-link{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:23px;min-height:28px}
.ac4-back-link .icon{width:14px;height:14px}
.ac4-back-link:hover{color:var(--ac4-brand)}
.ac4-check{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:11px;line-height:1.7}
.ac4-check input{margin:4px 0 0;accent-color:var(--ac4-brand);width:16px;height:16px;flex:0 0 16px}
.ac4-check button{font-size:inherit;color:var(--ac4-brand);padding:0;text-decoration:underline;text-underline-offset:2px}
.ac4-large-icon{display:grid;place-items:center;width:55px;height:55px;color:var(--ac4-brand);background:var(--soft);border:1px solid var(--line);border-radius:13px;margin-bottom:22px}
.ac4-large-icon .icon{width:26px;height:26px}
.ac4-stack-actions{display:flex;flex-direction:column;gap:11px;margin-top:24px}
.ac4-note{display:flex;gap:9px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--ac4-inset);color:var(--muted);font-size:11px;line-height:1.7;margin-top:20px}
.ac4-note>.icon{width:16px;height:16px;color:var(--ac4-brand);margin-top:2px}
.ac4-note.warning>.icon{color:var(--warning)}
.ac4-form .ac4-note{margin-top:0}
.ac4-email-box{border:1px solid var(--line);border-radius:9px;padding:18px;background:var(--ac4-inset);margin-top:22px;display:flex;align-items:flex-start;flex-direction:column;gap:9px;overflow-wrap:anywhere}
.ac4-email-box small{font-size:10px;color:var(--muted)}
.ac4-email-box strong{font-size:14px}
.ac4-auth-footnote{font-size:11px;color:var(--muted);line-height:1.8;margin-top:24px}
.ac4-form-error{font-size:11px;line-height:1.7;color:var(--negative);border:1px solid var(--negative);padding:12px;border-radius:7px;margin-top:20px;background:var(--surface)}
.ac4-page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.ac4-page-heading h1{font-size:29px;letter-spacing:-.8px;line-height:1.25;margin-top:7px}
.ac4-page-heading p{font-size:13px;line-height:1.75;color:var(--muted);margin-top:7px}
.ac4-eyebrow{font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:650}
.ac4-heading-actions{display:flex;gap:8px;flex-shrink:0}
.ac4-tabs{display:flex;gap:21px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-bottom:18px;max-width:100%;padding-bottom:0}
.ac4-tabs a{font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;padding:9px 2px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.ac4-tabs a:hover{color:var(--text)}
.ac4-tabs a.active{color:var(--ac4-brand);border-color:var(--ac4-brand);font-weight:650}
.ac4-proposed{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);margin:0 0 22px;line-height:1.6}
.ac4-card{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--ac4-radius);min-width:0;overflow-wrap:anywhere}
.ac4-two-columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:20px;align-items:start}
.ac4-side-stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.ac4-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}
.ac4-section-head h2{font-size:16px;line-height:1.4;letter-spacing:-.3px}
.ac4-section-head p{font-size:11px;line-height:1.7;color:var(--muted);margin-top:5px}
.ac4-section-head>.ac4-button{flex-shrink:0}
.ac4-avatar{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:inline-grid;place-items:center;background:var(--soft);color:var(--ac4-brand);font-size:11px;flex:0 0 36px;font-weight:650}
.ac4-avatar.large{width:62px;height:62px;flex-basis:62px;font-size:18px}
.ac4-identity{display:flex;align-items:center;gap:17px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.ac4-identity h2{font-size:20px;line-height:1.4;letter-spacing:-.3px}
.ac4-identity h3{font-size:15px}
.ac4-identity p{font-size:12px;line-height:1.6;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.ac4-identity.compact{border-bottom:0;padding-bottom:0;gap:12px}
.ac4-inline-badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.ac4-form-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:18px;margin-top:5px}
.ac4-form-footer>span{font-size:10px;color:var(--muted);line-height:1.6}
.ac4-form-footer>div{display:flex;gap:9px;flex-shrink:0}
.ac4-company-mini{display:flex;gap:11px;align-items:center;margin:0 0 21px}
.ac4-company-mini strong{font-size:13px;display:block}
.ac4-company-mini small{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.ac4-mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;line-height:1.6;color:var(--muted);margin:0 0 18px}
.ac4-quiet-box{padding:22px;border:1px solid var(--line);background:var(--ac4-inset);border-radius:var(--ac4-radius);min-width:0}
.ac4-quiet-box>strong,.ac4-quiet-box>h3{font-size:13px;line-height:1.5;color:var(--text);font-weight:600}
.ac4-quiet-box p{font-size:11px;line-height:1.85;color:var(--muted);margin-top:8px}
.ac4-quiet-box>.ac4-button{margin-top:10px}
.ac4-quiet-box>.ac4-setting-icon{margin-bottom:16px}
.ac4-setting-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:13px;align-items:center;padding:20px 0;border-top:1px solid var(--line)}
.ac4-setting-row:last-child{padding-bottom:0}
.ac4-setting-row h3{font-size:13px;line-height:1.5;font-weight:600}
.ac4-setting-row p{font-size:11px;line-height:1.7;color:var(--muted);margin-top:5px}
.ac4-setting-row .ac4-badge{margin-top:7px}
.ac4-setting-icon{display:inline-grid;place-items:center;width:36px;height:36px;flex:0 0 36px;background:var(--raised);border-radius:8px;color:var(--muted)}
.ac4-session{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:17px 0;border-top:1px solid var(--line)}
.ac4-session strong{font-size:12px;display:block;line-height:1.5}
.ac4-session small{font-size:10px;color:var(--muted);display:block;margin-top:5px;line-height:1.6}
.ac4-small-copy{font-size:10px;color:var(--muted);line-height:1.8;margin-top:16px}
.ac4-event-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:22px}
.ac4-event-list li{display:flex;gap:12px;align-items:flex-start}
.ac4-event-dot{display:block;flex:0 0 8px;width:8px;height:8px;background:var(--positive);border-radius:50%;margin-top:6px}
.ac4-event-dot.neutral{background:var(--muted)}
.ac4-event-list strong{font-size:11px;font-weight:600;display:block}
.ac4-event-list small{font-size:10px;color:var(--muted);display:block;margin-top:4px;line-height:1.6}
.ac4-event-list+.ac4-button{margin-top:22px}
.ac4-business-details,.ac4-ready-list{border:1px solid var(--line);border-radius:8px;background:var(--ac4-inset);overflow:hidden}
.ac4-business-details>div,.ac4-ready-list>div{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:14px 15px;font-size:11px;border-bottom:1px solid var(--line)}
.ac4-business-details>div:last-child,.ac4-ready-list>div:last-child{border-bottom:0}
.ac4-business-details span,.ac4-ready-list span{color:var(--muted)}
.ac4-business-details strong,.ac4-ready-list strong{font-weight:550;text-align:right;overflow-wrap:anywhere}
.ac4-provider{display:flex;align-items:center;gap:12px;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--ac4-inset);margin-top:22px;margin-bottom:16px;min-width:0}
.ac4-provider.compact{padding:0;background:transparent;border:0;margin-top:0;margin-bottom:22px}
.ac4-provider>div{flex:1;min-width:0}
.ac4-provider-logo{display:grid;place-items:center;width:41px;height:41px;flex:0 0 41px;border-radius:9px;background:#8e462b;color:#fff0e8;font-weight:750;font-size:20px}
:root[data-theme=light] .ac4-provider-logo{background:#f2ddd2;color:#87391e}
.ac4-provider strong{display:block;font-size:13px}
.ac4-provider small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.6}
.ac4-team-summary{display:flex;align-items:center;gap:14px;margin-bottom:23px}
.ac4-team-summary strong{font-size:11px;font-weight:500}
.ac4-avatar-stack{display:flex;padding-left:0}
.ac4-avatar-stack .ac4-avatar+.ac4-avatar{margin-left:-8px;border:3px solid var(--surface)}
.ac4-member-table{display:flex;flex-direction:column;min-width:0}

function ordersTable(rows,compact=false){return `<div class="table-wrap"><table><thead><tr><th>Pedido / produto</th>${compact?'':'<th>Data</th>'}<th>Shopee</th><th>Etapa interna</th><th class="numeric">Valor</th><th><span class="sr-only">Abrir</span></th></tr></thead><tbody>${rows.map(o=>`<tr><td><span class="cell-main">${o.id}</span><span class="cell-sub">${o.product} · ${o.qty} peça${o.qty>1?'s':''}</span></td>${compact?'':`<td>${o.date.slice(8)}/${o.date.slice(5,7)}<span class="cell-sub">Criação do pedido</span></td>`}<td>${pill(o.source,o.source==='Cancelado'?'bad':o.source==='Enviado'?'good':'blue')}</td><td>${pill(o.stage<0?'Revisar cancelamento':stages[o.stage],o.stage===3?'good':o.stage<0?'bad':o.stage===1?'blue':'')}</td><td class="numeric">${brl(o.total)}</td><td><button class="row-action" data-order="${o.id}" aria-label="Detalhar pedido ${o.id}">${icon('right')}</button></td></tr>`).join('')}</tbody></table></div>`}

t-size:11px;margin-top:4px">${demoReady()?rows.length:'—'} no recorte ilustrativo · datas em Brasília</p></div>${pill('Demonstração')}</div>${demoReady()?(rows.length?ordersTable(rows):emptyState('Nenhum pedido com estes filtros','Tente outro produto, etapa ou período.',button('Limpar filtros','clear-orders'))):unavailable()}<div class="table-footer"><span>${demoReady()?rows.length:0} itens exibidos nesta demonstração</span><span>Na aplicação: até 50 pedidos por página</span></div></section>`}

ass="split-row"><span>Energia</span><strong>${brl(180)}</strong></div><div class="split-row"><span>Outras despesas registradas</span><strong>${brl(77.2)}</strong></div><div class="split-row total"><span>Total do exemplo</span><strong>${brl(857.2)}</strong></div></div>`:unavailable()}<div class="notice" style="margin-top:18px;margin-bottom:0">${icon('info')}<div>Ausência de despesas registradas não comprova despesa zero. A declaração e a revisão existentes devem continuar visíveis.</div></div></div>`;}else{content=`<div class="notice">${icon('bank')}<div><strong>Data do dinheiro separada da data do pedido.</strong> Importar ou confirmar um vínculo não altera a fórmula do lucro previsto.</div></div><div class="equal-col"><div class="choice-card">${icon('bank')}<h3>Extrato Nubank</h3><p>Prévia de linhas CSV ou OFX para conferência antes da importação.</p>${button('Ver prévia demonstrativa','bank-preview',true)}</div><div class="choice-card">${icon('wallet')}<h3>Transferências Shopee</h3><p>Confira referências e valores do arquivo de transferências.</p>${button('Ver exemplo de conferência','bank-preview')}</div></div><div class="card card-pad"><h2>Vínculos para revisar</h2><p class="muted" style="font-size:12px;margin-top:5px">Sugestões precisam de revisão explícita.</p><div class="split-row"><span>Repasse DEMO-03 <small class="cell-sub">10/11 · transferência ilustrativa</small></span><strong>${brl(2150)}</strong>${pill('A revisar','warn')}</div>${button('Abrir conferência demonstrativa','bank-preview')}</div>`;}

rir dia','production-coverage')}</div></section></div>`;}else if(state.productionTab==='Fechamento semanal'){c=`<div class="notice">${icon('calendar')}<div><strong>Semana: sexta 06/11 às 13h → sexta 13/11 às 13h.</strong> Horário de Brasília. Inclui o início e exclui o instante final.</div></div><section class="card card-pad"><div class="card-header"><div><h2>Conferência dos intervalos</h2><p>Exemplo da semana em andamento · registros originais e revisões separados</p></div>${pill('Prévia','blue')}</div><div class="closing-grid">${['Sex · após 13h','Sábado','Domingo','Segunda','Terça','Quarta','Quinta','Sex · antes 13h'].map((d,i)=>`<div class="interval"><strong>${d}</strong><small>${i<5?'Intervalo encerrado':i===5?'Dia em andamento':'Ainda não encerrado'}</small>${pill(i<4?'Conferido':i===4?'Pendente':'Em aberto',i<4?'good':i===4?'warn':'')}</div>`).join('')}</div><div class="notice" style="--tone:var(--warning)">${icon('alert')}<div>A sexta-feira exige distribuição confirmada antes ou a partir das 13h. Dados ausentes não são substituídos por custo zero.</div></div>${button('Conferir intervalo','production-coverage',true)}</section>`;}else if(state.productionTab==='Registrar produção'){c=`<div class="card card-pad"><div class="card-header"><div><h2>Registrar fabricação realizada</h2><p>Data e quantidade reais, com custo confirmado por peça.</p></div>${pill('Simulação')}</div>${productionForm(false)}</div>`;}else if(state.productionTab==='DTF'){c=`<div class="notice">${icon('info')}<div><strong>O montador aprovado continua separado.</strong> Quantidades DTF não viram fabricação registrada automaticamente.</div></div><div class="mini-grid">${[['orders','Fila de pedidos','Confira os pedidos e as peças antes de montar.','Abrir pedidos','go-orders'],['box','Biblioteca de artes','Artes PNG no navegador usado para exportar.','Ver orientação','dtf-info'],['production','Filme e prévia','Configuração e prévia usam o montador existente.','Entender o fluxo','dtf-info'],['file' ice" style="margin-top:22px;margin-bottom:0">${icon('info')}<div>Proposta de layout preparada em 11/11/2026. Não é uma versão publicada no seu sistema.</div></div></div>`;}return header(meta[p][0],p==='costs'?'Edite custos com contexto, revisão e confirmação.':p==='connections'?'Veja a origem dos dados e o estado de cada integração.':p==='history'?'Consulte alterações e acompanhe as ações registradas.':'Acessos e informações organizados por finalidade.','',p==='auditor'?'INTELIGÊNCIA · MLS AUDITOR':'EQUIPE E MAIS')+c;}

/* MLS Commerce OS — local preview chart components. No network or dependencies. */
let v2VizSerial = 0;
const v2VizEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v2VizValid = value => typeof value === 'number' && Number.isFinite(value);
const v2VizNumber = (value, unit='integer', compact=false) => {
  if (!v2VizValid(value)) return 'Sem dado';
  if (unit === 'currency') return new Intl.NumberFormat('pt-BR', {style:'currency',currency:'BRL',maximumFractionDigits:compact&&Math.abs(value)>=10?0:2,notation:compact&&Math.abs(value)>=10000?'compact':'standard'}).format(value);
  if (unit === 'percent') return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(value)+'%';
  if (unit === 'ratio') return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(value)+'×';
  return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0,notation:compact&&Math.abs(value)>=10000?'compact':'standard'}).format(value);
};
function v2VizId(id) { return 'v2-'+String(id||'chart').replace(/[^a-zA-Z0-9_-]/g,'-')+'-'+(++v2VizSerial); }
function v2VizExtent(values,unit='integer') {
  const nums=values.filter(v2VizValid), lo=Math.min(0,...nums), hi=Math.max(0,...nums);
  const raw=(hi-lo||1)/4, magnitude=10**Math.floor(Math.log10(raw));
  const naturalStep=[1,2,2.5,5,10].find(v=>v*magnitude>=raw)*magnitude;
  const step=unit==='integer'?Math.max(1,Math.ceil(naturalStep)):naturalStep;
  const min=Math.floor(lo/step)*step, max=Math.ceil((hi||step)/step)*step;
  const ticks=[]; for(let x=min;x<=max+step*.01;x+=step) ticks.push(Math.abs(x)<step*.001?0:x);
  return {min,max,step,ticks};
}
function v2VizRuns(values) {
  const runs=[]; let run=[];
  values.forEach((v,i)=>{if(v2VizValid(v))run.push([i,v]);else if(run.length){runs.push(run);run=[];}});
  if(run.length) runs.push(run); return runs;
}
function v2VizLegend(series) {
  return '<div class="v2-viz-legend">'+series.map(s=>`<span><i style="--viz-color:${v2VizEsc(s.color||'var(--accent)')}"></i>${v2VizEsc(s.name)}</span>`).join('')+'</div>';
}
function v2VizTable(labels,series,unit,title) {
  return `<details class="v2-viz-data"><summary>Ver dados do gráfico</summary><div class="v2-viz-table-wrap"><table><caption>${v2VizEsc(title)} · valores da demonstração</caption><thead><tr><th scope="col">Período</th>${series.map(s=>`<th scope="col">${v2VizEsc(s.name)}</th>`).join('')}</tr></thead><tbody>${labels.map((label,i)=>`<tr><th scope="row">${v2VizEsc(label)}</th>${series.map(s=>`<td>${v2VizEsc(v2VizNumber(s.values[i],unit))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function v2VizEmpty(title,table='') {
  return `<div class="v2-viz"><div class="v2-viz-empty" role="status"><span class="v2-viz-empty-line"></span><strong>Sem série disponível</strong><span>${v2VizEsc(title)}: faltam dados para este recorte.</span></div>${table}</div>`;
}
function v2Spark(values,color='var(--accent)',opts={}) {
  const clean=Array.isArray(values)?values:[], width=opts.width||136, height=opts.height||44, uid=v2VizId('spark');
  if(!clean.some(v2VizValid))return '<span class="v2-spark-empty">Histórico indisponível</span>';
  const nums=clean.filter(v2VizValid), min=Math.min(...nums), max=Math.max(...nums), range=max-min||Math.max(Math.abs(max)*.1,1), pad=5;
  const x=i=>pad+(clean.length<2?(width-2*pad)/2:i/(clean.length-1)*(width-2*pad));
  const y=v=>max===min?height/2:height-pad-(v-min)/range*(height-pad*2);
  const runs=v2VizRuns(clean), end=clean.map((v,i)=>[v,i]).filter(([v])=>v2VizValid(v)).at(-1);
  const line=runs.map(run=>'<path d="'+run.map(([i,v],j)=>(j?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ')+'"/>').join('');
  const areas=runs.filter(r=>r.length>1).map(run=>`<path d="M${x(run[0][0])} ${height} ${run.map(([i,v])=>'L'+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ')} L${x(run.at(-1)[0])} ${height} Z"/>`).join('');
  return `<svg class="v2-spark" viewBox="0 0 ${width} ${height}" ${opts.label?`role="img" aria-label="${v2VizEsc(opts.label)}"`:'aria-hidden="true"'} style="--viz-color:${v2VizEsc(color)}"><defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${v2VizEsc(color)}" stop-opacity=".3"/><stop offset="100%" stop-color="${v2VizEsc(color)}" stop-opacity="0"/></linearGradient></defs><g fill="url(#${uid})">${areas}</g><g fill="none" stroke="${v2VizEsc(color)}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${line}</g><circle cx="${x(end[1])}" cy="${y(end[0])}" r="2.6" fill="${v2VizEsc(color)}"/></svg>`;
}
function v2Line(options) { return v2VizCartesian(options,'line'); }
function v2Bars(options) { return v2VizCartesian(options,'bars'); }
function v2VizCartesian(options,kind) {
  const {id,title='Evolução',labels=[],series=[],unit='integer'}=options;
  const uid=v2VizId(id), h=Math.max(200,Math.min(options.height||250,420)), w=640, left=70,right=18,top=20,bottom=38,pw=w-left-right,ph=h-top-bottom;
  const table=v2VizTable(labels,series,unit,title), all=series.flatMap(s=>s.values||[]);
  if(!labels.length||!all.some(v2VizValid))return v2VizEmpty(title,table);
  const extent=v2VizExtent(all,unit), y=v=>top+(extent.max-v)/(extent.max-extent.min)*ph;
  const x=i=>kind==='bars'?left+(i+.5)/labels.length*pw:left+(labels.length<2?pw/2:i/(labels.length-1)*pw);
  const axisName={currency:'R$',integer:'Quantidade',percent:'%',ratio:'ROAS · ×'}[unit]||'Valor';
  const tickEvery=Math.max(1,Math.ceil(labels.length/6));
  let markup=`<defs>${series.map((s,j)=>`<linearGradient id="${uid}-fill-${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${v2VizEsc(s.color||'var(--accent)')}" stop-opacity="${kind==='bars'?'.96':'.28'}"/><stop offset="100%" stop-color="${v2VizEsc(s.color||'var(--accent)')}" stop-opacity="${kind==='bars'?'.38':'.015'}"/></linearGradient>`).join('')}</defs>`;
  markup+=`<text x="${left}" y="11" class="v2-viz-axis-unit">${axisName}</text>`;
  markup+=extent.ticks.map(value=>`<g class="v2-viz-grid"><line x1="${left}" y1="${y(value)}" x2="${w-right}" y2="${y(value)}"/><text x="${left-12}" y="${y(value)+4}" text-anchor="end">${v2VizEsc(v2VizNumber(value,unit,true))}</text></g>`).join('');
  markup+=labels.map((label,i)=>(i%tickEvery===0||i===labels.length-1)?`<text class="v2-viz-tick" x="${x(i)}" y="${h-12}" text-anchor="${i===0&&kind==='line'?'start':i===labels.length-1&&kind==='line'?'end':'middle'}">${v2VizEsc(label)}</text>`:'').join('');
  if(kind==='line') {
    series.forEach((s,j)=>{
      const values=labels.map((_,i)=>s.values[i]), runs=v2VizRuns(values), color=v2VizEsc(s.color||'var(--accent)');
      markup+=runs.filter(r=>r.length>1).map(run=>`<path d="M${x(run[0][0])} ${y(0)} ${run.map(([i,v])=>'L'+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ')} L${x(run.at(-1)[0])} ${y(0)} Z" fill="url(#${uid}-fill-${j})"/>`).join('');
      markup+=runs.map(run=>`<path class="v2-viz-line" d="${run.map(([i,v],n)=>(n?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
      markup+=values.map((v,i)=>{if(!v2VizValid(v))return '';const tip=`${labels[i]} · ${s.name}: ${v2VizNumber(v,unit)}`;return `<g class="v2-viz-item" tabindex="0" role="button" aria-label="${v2VizEsc(tip)}" data-viz-tip="${v2VizEsc(tip)}" style="--viz-color:${color}"><circle cx="${x(i)}" cy="${y(v)}" r="10" fill="transparent"/><circle class="v2-viz-point" cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${color}" stroke="var(--surface)" stroke-width="1.6"/></g>`;}).join('');
    });
  } else {
    const group=pw/labels.length, bw=Math.min(30,group*.72/Math.max(series.length,1)), gap=Math.min(5,bw*.2), full=series.length*bw+(series.length-1)*gap;

function v2BindCharts() {
  if(v2BindCharts.bound)return;v2BindCharts.bound=true;
  let tip=null, active=null, pinned=false;
  const ensure=()=>{if(tip?.isConnected)return;tip=document.createElement('div');tip.id='v2ChartTooltip';tip.className='v2-chart-tooltip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);};
  const hide=()=>{if(active)active.removeAttribute('aria-describedby');active=null;pinned=false;if(tip)tip.hidden=true;};
  const position=(node,event)=>{const rect=node.getBoundingClientRect(), px=event&&typeof event.clientX==='number'?event.clientX:rect.left+rect.width/2,py=event&&typeof event.clientY==='number'?event.clientY:rect.top;const box=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-box.width-8,px+12))+'px';tip.style.top=Math.max(8,Math.min(innerHeight-box.height-8,py-box.height-14))+'px';};
  const show=(node,event)=>{ensure();if(active&&active!==node)active.removeAttribute('aria-describedby');active=node;tip.textContent=node.dataset.vizTip;tip.hidden=false;node.setAttribute('aria-describedby',tip.id);position(node,event);};
  const hit=e=>e.target instanceof Element?e.target.closest('[data-viz-tip]'):null;
  document.addEventListener('pointerover',e=>{const node=hit(e);if(node&&!pinned)show(node,e);});
  document.addEventListener('pointermove',e=>{const node=hit(e);if(node&&node===active&&!pinned)position(node,e);});
  document.addEventListener('pointerout',e=>{if(pinned)return;const node=hit(e),related=e.relatedTarget instanceof Element?e.relatedTarget.closest('[data-viz-tip]'):null;if(node&&node!==related&&document.activeElement!==node)hide();});
  document.addEventListener('focusin',e=>{const node=hit(e);if(node){pinned=false;show(node);}else hide();});
  document.addEventListener('focusout',e=>{if(hit(e)&&!pinned)hide();});
  document.addEventListener('click',e=>{const node=hit(e);if(node){const again=pinned&&active===node;if(again)hide();else{pinned=true;show(node,e);}}else if(!tip?.contains(e.target))hide();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();const node=hit(e);if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pinned=true;show(node);}});
  window.addEventListener('scroll',hide,{passive:true});window.addEventListener('resize',hide);
  new MutationObserver(()=>{if(active&&!active.isConnected)hide();}).observe(document.body,{childList:true,subtree:true});
}

function v4WeeklyRedraw(focusSelector='') {
  if(typeof render==='function')render();
  if(focusSelector)document.querySelector(focusSelector)?.focus({preventScroll:true});
}
function v4WeeklySelect(block,index) {
  const s=v4WeeklyState(),f=v4WeeklyFixture(s.week,state.mode),max=block==='manufacturing'?7:block==='sales'?6:1;
  if(!v4WeeklyDefinition(block)||!Number.isInteger(index)||index<0||index>max)return false;
  s.selected[block]=index;
  const readout=document.querySelector('[data-v4-week-readout="'+block+'"]');
  if(readout)readout.innerHTML=v4WeeklyReadout(f,block,index);
  document.querySelectorAll('[data-v4-week-pick-block="'+block+'"]').forEach(button=>{const active=Number(button.dataset.v4WeekPick)===index;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
  return true;
}
function v4WeeklyChartEvent(event) {
  const point=event.target.closest?.('[data-v4-week-chart] [data-viz-tip]');
  if(!point)return;
  const wrap=point.closest('[data-v4-week-chart]'),block=wrap.dataset.v4WeekChart,s=v4WeeklyState(),f=v4WeeklyFixture(s.week,state.mode);
  if(event.type==='keydown'&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
    event.preventDefault();const points=[...wrap.querySelectorAll('[data-viz-tip]')],at=points.indexOf(point),next=event.key==='Home'?0:event.key==='End'?points.length-1:Math.max(0,Math.min(points.length-1,at+(event.key==='ArrowRight'?1:-1)));points[next]?.focus();return;
  }
  if(event.type==='keydown'&&!['Enter',' '].includes(event.key))return;
  const labels=v4WeeklySeries(f,block,s.metrics[block]).labels,index=labels.findIndex(label=>point.dataset.vizTip.startsWith(label+' · '));
  if(index>=0)v4WeeklySelect(block,index);
}
function v4BindWeeklyPreview() {
  if(v4BindWeeklyPreview.bound)return;
  v4BindWeeklyPreview.bound=true;
  document.addEventListener('click',event=>{
    const button=event.target.closest?.('[data-v4-week-block],[data-v4-week-set],[data-v4-week-refresh],[data-v4-week-recover],[data-v4-week-pick]');
    if(!button)return;
    event.preventDefault();const s=v4WeeklyState();
    if(button.dataset.v4WeekBlock){s.block=button.dataset.v4WeekBlock;v4WeeklyRedraw('[data-v4-week-block="'+s.block+'"]');}
    else if(button.dataset.v4WeekSet){s.week=button.dataset.v4WeekSet;s.message='Amostra fictícia de '+v4WeeklyDate(s.week)+' carregada localmente.';v4WeeklyRedraw('[data-v4-week-select]');}
    else if(button.hasAttribute('data-v4-week-pick'))v4WeeklySelect(button.dataset.v4WeekPickBlock,Number(button.dataset.v4WeekPick));
    else if(button.hasAttribute('data-v4-week-recover')){state.mode='filled';s.lastMode='filled';const control=document.getElementById('previewState');if(control)control.value='filled';s.message='Recuperação simulada. Dados fictícios preenchidos, sem consulta à loja.';v4WeeklyRedraw('[data-v4-week-refresh]');}
    else {s.message='Exemplo relido localmente. Nenhuma fonte externa consultada.';const status=document.querySelector('[data-v4-week-status]');if(status)status.textContent=s.message;}
  });
  document.addEventListener('change',event=>{
    const target=event.target,s=v4WeeklyState();
    if(target.matches?.('[data-v4-week-select]')&&['2026-11-06','2026-11-13'].includes(target.value)){s.week=target.value;s.message='Amostra fictícia de '+v4WeeklyDate(s.week)+' carregada localmente.';v4WeeklyRedraw('[data-v4-week-select]');}
    if(target.matches?.('[data-v4-week-metric]')){const block=target.dataset.v4WeekMetric,d=v4WeeklyDefinition(block);if(d?.metrics.some(([key])=>key===target.value)){s.metrics[block]=target.value;v4WeeklyRedraw('[data-v4-week-metric="'+block+'"]');}}
  });
  document.addEventListener('click',v4WeeklyChartEvent);
  document.addEventListener('focusin',v4WeeklyChartEvent);
  document.addEventListener('keydown',v4WeeklyChartEvent);
}
v4BindWeeklyPreview();

  function value(id) { return document.getElementById(id)?.value.trim() || ''; }
  function addMember(name, email, role) {
    if (demo.members.some(m => m.email.toLowerCase() === email.toLowerCase())) { toast('Esse e-mail já está na equipe de demonstração.'); return false; }
    demo.members.push({id:String(demo.nextMember++),name:name || 'Pessoa convidada',email,role,state:'Convite pendente'});
    return true;
  }

  document.addEventListener('submit', event => {
    const form = event.target.closest?.('form[data-ac4-form]');
    if (!form) return;
    event.preventDefault(); event.stopImmediatePropagation();
    if (!form.reportValidity()) return;
    const kind = form.dataset.ac4Form;
    // Do not use FormData here: password inputs are intentionally never read.
    clearPasswords(form);
    if (kind === 'login') { demo.loginError = false; navigate('overview'); toast('Gestor demonstrativo aberto. Nenhuma autenticação real foi realizada.'); }
    else if (kind === 'signup') { demo.name = value('ac4-signup-name'); demo.email = value('ac4-signup-email'); demo.members[0].name = demo.name; demo.members[0].email = demo.email; demo.verified = false; demo.verifyReturn = 'onboarding'; navigate('verify'); }
    else if (kind === 'recover') { demo.recoverySent = true; render(); }
    else if (kind === 'password-reset' || kind === 'password-change') { closeDialog(); demo.recoveryReset = false; demo.recoverySent = false; navigate(kind === 'password-reset' ? 'login' : 'security'); toast('Etapa de senha demonstrada. Nenhuma senha foi salva ou alterada.'); }
    else if (kind === 'onboard-company') { demo.company = value('ac4-onboard-company'); demo.onboarding = 2; render(); }
    else if (kind === 'onboard-invite') { if (addMember(value('ac4-onboard-person'),value('ac4-onboard-email'),value('ac4-onboard-role'))) { demo.onboarding = 4; render(); toast('Convite adicionado apenas ao exemplo. Nenhum e-mail enviado.'); } }
    else if (kind === 'profile') { const nextEmail = value('ac4-profile-email'); if (nextEmail !== demo.email) { demo.verified = false; demo.verifyReturn = 'account'; } demo.name = value('ac4-profile-name'); demo.email = nextEmail; demo.members[0].name = demo.name; demo.members[0].email = demo.email; document.documentElement.dataset.theme = value('ac4-profile-theme') === 'light' ? 'light' : 'dark'; render(); toast('Perfil atualizado apenas nesta demonstração.'); }
    else if (kind === 'company') { demo.company = value('ac4-company-name'); demo.legal = value('ac4-company-legal'); render(); toast('Empresa atualizada apenas nesta demonstração.'); }
    else if (kind === 'invite') { if (addMember(value('ac4-invite-name'),value('ac4-invite-email'),value('ac4-invite-role'))) { closeDialog(); render(); toast('Convite simulado. Nenhuma mensagem foi enviada.'); } }
    else if (kind === 'member') { const member = demo.members.find(m => m.id === form.dataset.member); if (member && member.id !== '1') member.role = value('ac4-member-role'); closeDialog(); render(); toast('Permissão alterada somente na lista demonstrativa.'); }
  }, true);

  function act(action, target) {
    if (action === 'show-password') { const input = document.getElementById(target.dataset.target); if (input) { const reveal = input.type === 'password'; input.dataset.ac4Password = 'true'; input.type = reveal ? 'text' : 'password'; target.setAttribute('aria-pressed',String(reveal)); target.setAttribute('aria-label',reveal ? 'Ocultar senha' : 'Mostrar senha'); } }
    else if (action === 'login-error') { demo.loginError = !demo.loginError; render(); }
    else if (action === 'verify') { demo.verified = true; if (demo.verifyReturn === 'onboarding') demo.onboarding = 1; navigate(demo.verifyReturn); toast('Verificação simulada. Nenhuma conta real foi validada.'); }
    else if (action === 'resend-verification') toast('Reenvio simulado. Nenhum e-mail foi enviado.');
    else if (action === 'recovery-reset') { demo.recoveryReset = true; render(); }
    else if (action === 'recovery-restart') { demo.recoverySent = false; demo.recoveryReset = false; render(); }
    else if (action === 'onboard-next') { demo.onboarding = Math.min(4,demo.onboarding+1); render(); document.getElementById('main').focus(); }
    else if (action === 'onboard-back') { demo.onboarding = Math.max(1,demo.onboarding-1); render(); }
    else if (action === 'connect-store') { demo.connected = true; render(); toast('Conexão fictícia marcada na prévia. Nenhum OAuth foi iniciado.'); }
    else if (action === 'open-connect') { demo.onboarding = 2; navigate('onboarding'); }
    else if (action === 'open-company') navigate('company');
    else if (action === 'profile-menu') modal('Sua conta',`<div class="ac4-modal-content"><div class="ac4-identity compact"><span class="ac4-avatar large">${e(initials(demo.name))}</span><div><h3>${e(demo.name)}</h3><p>${e(demo.email)}</p>${badge('Perfil fictício')}</div></div><div class="ac4-stack-actions">${link('Minha conta','account','wide')}${link('Segurança e dispositivos','security','wide')}${link('Minha empresa','company','wide')}${link('Pessoas e acessos','team','wide')}${button('Sair da demonstração','signout','text wide')}</div></div>`,'Conta e empresa · visão proposta');
    else if (action === 'change-password') modal('Alterar senha',`<div class="ac4-modal-content">${note('Use somente valores fictícios. Os campos não são lidos, salvos ou enviados.')}<form class="ac4-form" data-ac4-form="password-change">${password('ac4-old-password','Senha atual')}${password('ac4-new-password','Nova senha')}<button class="ac4-button primary wide" type="submit">Concluir simulação</button></form></div>`,'Fluxo proposto · reautenticação necessária na aplicação');
    else if (action === 'mfa') modal('Autenticação em duas etapas',`<div class="ac4-modal-content"><span class="ac4-large-icon">${svg('eye')}</span><p>${demo.mfa ? 'O estado está ativado apenas nesta demonstração.' : 'Na implementação, você vinculará um fator de autenticação e confirmará um desafio antes da ativação.'}</p><ol class="ac4-numbered-list"><li>Confirmar sua identidade.</li><li>Configurar e validar o segundo fator.</li><li>Guardar códigos de recuperação de uso único.</li></ol>${note('Esta prévia não gera QR, segredo ou código de recuperação.')}${button(demo.mfa ? 'Simular desativação' : 'Simular ativação','mfa-confirm','primary wide')}</div>`,'Segurança de conta · evolução proposta');
    else if (action === 'mfa-confirm') { demo.mfa = !demo.mfa; closeDialog(); render(); toast('Estado de autenticação alterado apenas na demonstração.'); }
    else if (action === 'revoke-session') { demo.sessions = demo.sessions.filter(s => s.id !== target.dataset.session || s.current); render(); toast('Sessão fictícia removida da lista. Nenhum dispositivo real foi desconectado.'); }
    else if (action === 'revoke-others') { demo.sessions = demo.sessions.filter(s => s.current); render(); toast('Outras sessões fictícias removidas da demonstração.'); }
    else if (action === 'security-history') modal('Atividade de segurança',`<div class="ac4-modal-content">${note('Eventos abaixo são exemplos de apresentação, sem registros reais.')}<div class="ac4-ready-list"><div><span>Hoje · 09:42</span><strong>Entrada no computador · exemplo</strong></div><div><span>Ontem · 16:10</span><strong>Preferência de tema atualizada · exemplo</strong></div><div><span>Há 2 dias · 08:25</span><strong>E-mail verificado · exemplo</strong></div></div></div>`,'Histórico demonstrativo');
    else if (action === 'invite') inviteModal();
    else if (action === 'member-info' || action === 'member-manage') inviteModal(demo.members.find(m => m.id === target.dataset.member));
    else if (action === 'resend-invite') toast('Reenvio de convite simulado. Nenhum e-mail foi enviado.');
    else if (action === 'remove-member') { const member = demo.members.find(m => m.id === target.dataset.member); if (!member || member.id === '1') return; modal('Remover do exemplo?',`<div class="ac4-modal-content"><p><strong>${e(member.name)}</strong> será removido apenas da lista fictícia desta prévia.</p>${note('Na aplicação, remover acesso precisa revogar a autorização no servidor.')}<div class="ac4-step-actions">${button('Voltar','member-manage','',`data-member="${member.id}"`)}${button('Remover do exemplo','remove-member-confirm','danger',`data-member="${member.id}"`)}</div></div>`,'Nenhum acesso real será alterado'); }
    else if (action === 'remove-member-confirm') { demo.members = demo.members.filter(m => m.id !== target.dataset.member || m.id === '1'); closeDialog(); render(); toast('Pessoa removida somente da demonstração.'); }
    else if (action === 'select-plan') { demo.plan = target.dataset.plan; render(); toast('Preferência de plano alterada no exemplo. Nenhuma assinatura contratada.'); }
    else if (action === 'company-lifecycle') modal('Propriedade e encerramento',`<div class="ac4-modal-content">${note('Fluxos propostos. Esta prévia não transfere propriedade nem apaga dados.')}<div class="ac4-lifecycle-block"><h3>Transferir responsabilidade</h3><p>Confirmar identidade, escolher um membro elegível e obter o aceite do novo proprietário.</p></div><div class="ac4-lifecycle-block"><h3>Encerrar empresa</h3><p>Conferir vínculos, dados a preservar e política de retenção antes de uma confirmação explícita.</p></div><div class="ac4-lifecycle-block"><h3>Excluir conta pessoal</h3><p>Resolver a propriedade das empresas e separar o perfil pessoal do histórico da operação.</p></div></div>`,'Decisões que exigem confirmação e proteção do histórico');
    else if (action === 'terms' || action === 'privacy') modal(action === 'terms' ? 'Termos de uso demonstrativos' : 'Privacidade nesta prévia',`<div class="ac4-modal-content"><p>Esta tela apresenta a posição e o fluxo dos documentos no cadastro. Não contém termos comerciais definitivos.</p>${note('Não use dados ou senhas reais. Esta extensão não envia solicitações nem salva senhas, tokens ou convites fora da página.')}<p>Os documentos da aplicação comercial deverão refletir os serviços efetivos e sua política de dados antes da publicação.</p></div>`,'Documento de layout · conteúdo final a definir');
    else if (action === 'signout') modal('Sair da demonstração?',`<div class="ac4-modal-content"><p>Você voltará à tela de entrada. Nenhuma sessão real será encerrada.</p><div class="ac4-step-actions">${link('Continuar no gestor','overview')}${button('Voltar para entrar','signout-confirm','primary')}</div></div>`,'Saída demonstrativa');
    else if (action === 'signout-confirm') { document.querySelectorAll('input[type="password"],input[data-ac4-password]').forEach(input => { input.value = ''; }); closeDialog(); navigate('login'); }
  }

  document.addEventListener('click', event => {
    const target = event.target.closest?.('[data-ac4-action]');
    if (!target) return;
    event.preventDefault(); event.stopImmediatePropagation();
    act(target.dataset.ac4Action,target);
  }, true);
  document.addEventListener('keydown', event => {
    const target = event.target.closest?.('[role="button"][data-ac4-action]');
    if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); act(target.dataset.ac4Action,target); }
  });
})();

/* V4 shell integration — independent demonstration, no requests. */
(() => {
  meta.weekly = ['Relatórios', 'file'];
  meta.agents[0] = 'Agentes';
  meta.roadmap[0] = 'Novidades e versão';
  searchEntries.push({title:'Resumo semanal',copy:'Fabricação, estimativa de vendas e movimentos importados',page:'weekly',icon:'file'});
  searchEntries.push({title:'Minha conta',copy:'Perfil, segurança, preferências e sessões demonstrativas',page:'account',icon:'team'});
  searchEntries.push({title:'Pessoas e acessos',copy:'Equipe humana, convites e papéis propostos',page:'team',icon:'team'});
  const previousChrome=appChrome, previousRender=render;
  appChrome=function(){
    previousChrome();
    const financeLink=document.querySelector('#sidebar a[data-page="finance"]');
    if(financeLink&&!document.querySelector('#sidebar a[data-page="weekly"]'))financeLink.insertAdjacentHTML('afterend',`<a class="nav-link ${state.page==='weekly'?'active':''}" href="#weekly" data-page="weekly" ${state.page==='weekly'?'aria-current="page"':''}>${icon('file')}<span>Relatórios</span></a>`);
    const more=document.querySelector('#sidebar .nav-more>summary');
    if(more)more.innerHTML=icon('grid')+'Mais ferramentas'+icon('down');
    document.querySelectorAll('#sidebar .version span:last-child').forEach(x=>x.textContent='Layout 04');
    const bar=document.querySelector('.preview-label');
    if(bar&&!bar.querySelector('.v4-preview-links'))bar.insertAdjacentHTML('beforeend','<nav class="v4-preview-links" aria-label="Explorar a proposta"><a href="#overview" data-page="overview">Painel</a><a href="#weekly" data-page="weekly">Semanal</a><a href="#login" data-page="login">Login</a><a href="#account" data-page="account">Conta</a></nav>');
  };
  render=function(){
    if(state.page!=='weekly')return previousRender();
    document.body.classList.remove('ac4-public','ac4-account-page');
    appChrome();
    const main=document.getElementById('main');main.dataset.area='weekly';
    main.innerHTML=v4WeeklyReport()+'<footer class="route-note"><span>Prévia de layout · dados fictícios · nenhuma operação real</span><span>MLS Commerce OS · Layout 04</span></footer>';
    document.title='Resumo semanal · MLS Commerce OS · Layout 04';
  };
})();

const initial=location.hash.slice(1);if(meta[initial])state.page=initial;render();
</script>
